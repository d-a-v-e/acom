body: |
  Went to my local pub to meet with some friends I've not seen for a long time (maybe 7 years?)
  we last were together during the trip to Budapest. I miss travelling and seeing friends.
  we had a good time but i felt like we've drifted apart. one has kids, the other has completely changed
  their career. they seem happier for it but it sounds like a dificult life for both of them. maybe If I'd stuck with
  my dream of being a vet and gone to medical school instead caring for mum things woud have been different.
  its the aniversary of her death next week. can't believe its been 3 years already...
  I've got the trip to rome with my husband to look forward to at least. June 2027 can't come soon enough.
  The business thing with Sam has been going about 18 months now. Still ticking over but it's starting to feel tiring.

