version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    bundler-patches:
      patterns:
        - "*"
      update-types:
        - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-patches:
      patterns:
        - "*"
      update-types:
        - patch
